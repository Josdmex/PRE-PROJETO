<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopfy</title>
</head>
<body>
    <header>
        <div>
            <h1>Cadastrar-se agora ou faça login</h1>
            <div class="gmail-div">
                <form action="/">
                    <div class="email-div">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu email" required>
                    </div>
                </form>
                <form action="/">
                    <div class="senha-div">
                        <label for="senha">Senha</label>
                        <input type="senha" id="senha" placeholder="Digite sua senha" required>
                    </div>
                </form>
            </div>
            <button type="login">Entrar</button>
        </div>
    </header>
</body>
</html>
